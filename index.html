<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAVIS · Fingerprint Lookup</title>
<style>
  :root{
    --bg:#070b14;
    --bg-2:#0d1420;
    --card:#0f1726;
    --card-2:#131c2e;
    --border:#1e2a41;
    --border-2:#28354f;
    --text:#e8eef7;
    --muted:#7b8aa3;
    --muted-2:#5a6880;
    --green:#00d68f;
    --green-dark:#00b377;
    --green-glow:rgba(0,214,143,.18);
    --gold:#f5c542;
    --danger:#ff5c7a;
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(900px 600px at 50% -10%, #10203a 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 100%, #0a1a2e 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    width:100%;
    max-width:460px;
    background:linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 22px 24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.03) inset,
      0 20px 60px rgba(0,0,0,.55),
      0 0 0 1px rgba(0,214,143,.04);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--green) 40%, var(--gold) 60%, transparent);
    opacity:.85;
  }

  /* ---------- Header ---------- */
  .brand{
    display:flex;align-items:center;gap:10px;
    margin-bottom:18px;
  }
  .brand-logo{
    width:34px;height:34px;flex:0 0 34px;
    border-radius:9px;
    background:linear-gradient(135deg, var(--green) 0%, #00a86b 100%);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;letter-spacing:-.5px;
    color:#04121c;
    box-shadow:0 6px 18px var(--green-glow);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15}
  .brand-name{
    font-size:15px;font-weight:700;letter-spacing:.02em;
    color:var(--text);
  }
  .brand-sub{
    font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.14em;margin-top:2px;
  }

  h1{
    font-size:19px;font-weight:700;letter-spacing:-.01em;
    margin:0 0 4px;color:var(--text);
  }
  .subtitle{
    font-size:13px;color:var(--muted);margin:0 0 22px;
  }

  /* ---------- Field ---------- */
  label{
    display:block;
    font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);
    margin-bottom:8px;
  }
  .input-row{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  input[type="tel"]{
    flex:1 1 auto;
    min-width:0;
    background:#0a1220;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 14px;
    color:var(--text);
    font-size:16px;           /* 16px avoids iOS zoom-on-focus */
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.02em;
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="tel"]::placeholder{color:var(--muted-2);font-family:inherit}
  input[type="tel"]:focus{
    border-color:var(--green);
    background:#0c1524;
    box-shadow:0 0 0 3px var(--green-glow);
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:var(--radius-sm);
    font-weight:600;
    transition:transform .08s, background .15s, box-shadow .15s, opacity .15s;
  }
  button:active:not(:disabled){transform:translateY(1px)}

  #searchBtn{
    flex:0 0 auto;
    padding:0 20px;
    font-size:14px;
    letter-spacing:.01em;
    color:#04121c;
    background:linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
    box-shadow:0 6px 20px var(--green-glow), 0 1px 0 rgba(255,255,255,.15) inset;
    white-space:nowrap;
  }
  #searchBtn:hover:not(:disabled){
    background:linear-gradient(180deg, #0ae69b 0%, var(--green) 100%);
    box-shadow:0 8px 24px rgba(0,214,143,.28), 0 1px 0 rgba(255,255,255,.2) inset;
  }
  #searchBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
    box-shadow:none;
  }

  /* ---------- Status ---------- */
  .status{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    min-height:20px;
    display:flex;align-items:center;gap:8px;
  }
  .status.error{color:var(--danger)}
  .status.info{color:var(--muted)}
  .status.success{color:var(--green)}

  /* ---------- Result ---------- */
  .result{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid var(--border);
    display:none;
    animation:fadeIn .25s ease-out;
  }
  .result.show{display:block}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
  }
  .result-label{
    font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);
    margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .result-label::after{
    content:"VERIFIED";
    font-size:10px;font-weight:700;
    color:var(--green);
    letter-spacing:.12em;
    padding:3px 8px;
    border-radius:20px;
    background:var(--green-glow);
    border:1px solid rgba(0,214,143,.25);
  }
  .fp-box{
    display:flex;align-items:center;gap:10px;
    background:#0a1220;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 14px 14px 16px;
    transition:border-color .2s;
  }
  .fp-box:hover{border-color:var(--border-2)}
  .fp-value{
    flex:1;
    min-width:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px;
    font-weight:600;
    letter-spacing:.04em;
    word-break:break-all;
    color:var(--green);
    text-shadow:0 0 14px var(--green-glow);
  }
  .copy-btn{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--border-2);
    color:var(--text);
    padding:9px 14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:8px;
  }
  .copy-btn:hover{background:#1a2438;border-color:#374a68}
  .copy-btn.copied{
    color:#04121c;
    background:linear-gradient(180deg, var(--gold) 0%, #d9a92e 100%);
    border-color:transparent;
    box-shadow:0 6px 18px rgba(245,197,66,.22);
  }

  /* ---------- Footer ---------- */
  .footer{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--border);
    font-size:11px;
    color:var(--muted-2);
    text-align:center;
    letter-spacing:.04em;
  }
  .footer span{color:var(--green)}

  /* ---------- Spinner ---------- */
  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid rgba(0,214,143,.2);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Small phones ---------- */
  @media (max-width:400px){
    .input-row{flex-wrap:wrap}
    input[type="tel"]{flex:1 1 100%}
    #searchBtn{flex:1 1 100%;padding:14px 20px}
    .card{padding:22px 18px 20px}
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <header class="brand">
      <div class="brand-logo" aria-hidden="true">T</div>
      <div class="brand-text">
        <div class="brand-name">TRAVIS</div>
        <div class="brand-sub">Fingerprint Lookup</div>
      </div>
    </header>

    <h1>Retrieve a fingerprint</h1>
    <p class="subtitle">Enter a phone number to look up its linked device fingerprint.</p>

    <label for="phone">Phone number</label>
    <div class="input-row">
      <input id="phone" type="tel" inputmode="numeric" placeholder="0712345678" autocomplete="off" />
      <button id="searchBtn" type="button">Search</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <section class="result" id="result">
      <div class="result-label">Fingerprint</div>
      <div class="fp-box">
        <span class="fp-value" id="fpValue">—</span>
        <button class="copy-btn" id="copyBtn" type="button">Copy</button>
      </div>
    </section>

    <div class="footer">Secured by <span>TRAVIS</span> · Kenya</div>
  </main>

<script>
(function () {
  const API_BASE = 'https://travis-j1w9.onrender.com';

  const phoneInput = document.getElementById('phone');
  const searchBtn  = document.getElementById('searchBtn');
  const statusEl   = document.getElementById('status');
  const resultEl   = document.getElementById('result');
  const fpValueEl  = document.getElementById('fpValue');
  const copyBtn    = document.getElementById('copyBtn');

  let copyResetTimer = null;

  function normalizePhone(raw) {
    if (!raw) return '';
    let p = raw.toString().replace(/[\s\-\(\)]/g, '');
    if (p.startsWith('+')) p = p.slice(1);
    if (p.startsWith('0')) p = '254' + p.slice(1);
    if (p.startsWith('7') || p.startsWith('1')) p = '254' + p;
    return p;
  }
  function isValidKenyan(p){ return /^254(7|1)\d{8}$/.test(p); }

  function setStatus(msg, type) {
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusEl.innerHTML = msg;
  }

  async function lookup() {
    const raw = phoneInput.value.trim();
    if (!raw) {
      setStatus('Please enter a phone number.', 'error');
      resultEl.classList.remove('show');
      return;
    }
    const normalized = normalizePhone(raw);
    if (!isValidKenyan(normalized)) {
      setStatus('Invalid Kenyan number. Try 0712345678 or +254712345678.', 'error');
      resultEl.classList.remove('show');
      return;
    }

    searchBtn.disabled = true;
    setStatus('<span class="spinner"></span>Searching…', 'info');
    resultEl.classList.remove('show');

    try {
      const res = await fetch(`${API_BASE}/lookup-fingerprint`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: normalized })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        setStatus(data.error || 'Lookup failed. Please try again.', 'error');
        return;
      }
      if (!data.fingerprint) {
        setStatus('No fingerprint found for that number.', 'error');
        return;
      }

      fpValueEl.textContent = data.fingerprint;
      resultEl.classList.add('show');
      setStatus('Fingerprint retrieved.', 'success');
    } catch (err) {
      setStatus('Network error. Please try again.', 'error');
    } finally {
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener('click', lookup);
  phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });

  copyBtn.addEventListener('click', async () => {
    const text = fpValueEl.textContent;
    if (!text || text === '—') return;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.textContent = 'Copied';
    copyBtn.classList.add('copied');
    clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1500);
  });
})();
</script>
</body>
</html>
